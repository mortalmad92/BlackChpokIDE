[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackchpok-ide"
version = "1.7.1"
description = "BlackChpok IDE — локальна IDE з агентом і MCP-інструментами"
readme = "README_UK.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "BlackChpok" }]

# Базові залежності. Опційні описані в requirements.txt з поясненнями:
# без них IDE запускається, але частина можливостей вимикається.
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openai>=1.40.0",
    "ollama>=0.3.0",
    "pymupdf>=1.24.0",
    "pikepdf>=9.0.0",
]

[project.optional-dependencies]
# Опційні бібліотеки: код їх використовує, але вміє працювати й без них.
full = [
    "numpy>=1.26.0",     # векторний пошук RAG
    "pillow>=10.0.0",    # скріншоти застосунку
    "pygments>=2.17.0",  # підсвітка синтаксису (є власна, простіша)
]
dev = [
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["blackchpok_ide*"]

# ─────────────────────────────────────────────────────────────────────────────
# Стиль коду
# ─────────────────────────────────────────────────────────────────────────────
# Проєкт пише код у стилі «як зараз»: максимальна довжина рядка 100 символів,
# подвійні лапки, українські докстрінги. Правила нижче фіксують саме це,
# щоб лінтер не пропонував переписати наявний код «на свій смак».

[tool.ruff]
line-length = 100
target-version = "py311"
# Теки, які не перевіряємо: віртуальне середовище, збірки, тимчасові.
exclude = [
    ".venv",
    ".buildtmp",
    "build",
    "dist",
    "__pycache__",
    "userdata",
    ".mcp_rag",
]

[tool.ruff.lint]
# E — помилки pycodestyle, F — pyflakes, W — попередження,
# I — порядок імпортів, B — типові баги (bugbear), UP — сучасний синтаксис.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # довжина рядка: багато рядків із текстами Ukrainian > 100
    "B008",   # виклик у значенні за замовчуванням — типовий патерн tkinter
    "UP038",  # isinstance з кортежем — читабельніше для цього проєкту
    "E731",   # lambda у змінній — прийнятно для дрібних обробників
]

[tool.ruff.lint.per-file-ignores]
# Тести можуть мати довгі рядки з текстами перевірок і локальні імпорти.
"tests/*" = ["E501", "B011", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────────────────────
# Тести
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
# Проєкт використовує unittest, але pytest теж має знати, де шукати.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
